name: Build Finance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: finance-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare Android project
        run: |
          mkdir -p android/app/src/main/assets/www android/app/src/main/java/com/finance/app android/app/src/main/res/values android/app/src/main/res/drawable
          test -f assets/finance-image.jpg || (echo "ERROR: Falta assets/finance-image.jpg. Descarga la imagen y súbela con exactamente ese nombre." && exit 1)
          cp index.html manifest.webmanifest sw.js google-config.js android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/
          cp -r assets android/app/src/main/assets/www/
          cp assets/finance-image.jpg android/app/src/main/res/drawable/finance_image.jpg

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Finance'
          include ':app'
          project(':app').projectDir = file('android/app')
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.finance.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.finance.app'
              minSdk 23
              targetSdk 35
              versionCode 3
              versionName '3.0.0'
            }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/AppTheme" android:label="Finance" android:icon="@drawable/finance_image" android:roundIcon="@drawable/finance_image" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#111827</item>
              <item name="android:navigationBarColor">#ffffff</item>
              <item name="android:statusBarColor">#ffffff</item>
              <item name="android:windowLightStatusBar">true</item>
            </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/finance/app/MainActivity.java <<'EOF'
          package com.finance.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;
          import android.view.WindowManager;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
            private static final String API_URL =
                "https://script.google.com/macros/s/AKfycbxTjFz6HbRs8zzgqtI4_NvsooLalnJr6oZO7ZgLsknzRnRnW9E_8StuUq6n6IBEiyw/exec";

            private WebView webView;

            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              requestWindowFeature(Window.FEATURE_NO_TITLE);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              webView = new WebView(this);
              webView.setWebViewClient(new WebViewClient());
              webView.getSettings().setJavaScriptEnabled(true);
              webView.getSettings().setDomStorageEnabled(true);
              webView.getSettings().setAllowFileAccess(true);
              webView.addJavascriptInterface(new FinanceBridge(), "AndroidFinance");
              webView.loadUrl("file:///android_asset/www/index.html");
              setContentView(webView);
            }

            private class FinanceBridge {
              @JavascriptInterface
              public void request(final String payload, final String requestId) {
                new Thread(() -> {
                  boolean ok = false;
                  String response;
                  HttpURLConnection conn = null;

                  try {
                    URL url = new URL(API_URL);
                    conn = (HttpURLConnection) url.openConnection();
                    conn.setInstanceFollowRedirects(false);
                    conn.setRequestMethod("POST");
                    conn.setDoOutput(true);
                    conn.setConnectTimeout(20000);
                    conn.setReadTimeout(30000);
                    conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                    conn.setRequestProperty("Accept", "application/json");

                    try (OutputStream os = conn.getOutputStream()) {
                      os.write(payload.getBytes(StandardCharsets.UTF_8));
                    }

                    int code = conn.getResponseCode();

                    if (code == 301 || code == 302 || code == 303 ||
                        code == 307 || code == 308) {
                      String location = conn.getHeaderField("Location");
                      conn.disconnect();
                      conn = null;

                      if (location == null || location.trim().isEmpty()) {
                        throw new Exception("Redirección de Google Apps Script sin destino.");
                      }

                      URL redirected = new URL(url, location);
                      conn = (HttpURLConnection) redirected.openConnection();
                      conn.setInstanceFollowRedirects(false);
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(20000);
                      conn.setReadTimeout(30000);
                      conn.setRequestProperty("Accept", "application/json");
                      code = conn.getResponseCode();
                    }

                    InputStream stream =
                        code >= 400 ? conn.getErrorStream() : conn.getInputStream();
                    response = readAll(stream);

                    if (response == null || response.trim().isEmpty()) {
                      throw new Exception("Google Apps Script devolvió una respuesta vacía. HTTP " + code);
                    }

                    try {
                      new JSONObject(response);
                    } catch (Exception ignored) {
                      throw new Exception("Google Apps Script no devolvió JSON. HTTP " + code);
                    }

                    ok = code >= 200 && code < 300;

                  } catch (Exception e) {
                    String errorMessage = "No se pudo conectar con Google Sheets: " + String.valueOf(e.getMessage());
                    response = "{\"ok\":false,\"error\":" + JSONObject.quote(errorMessage) + "}";
                  } finally {
                    if (conn != null) conn.disconnect();
                  }

                  final boolean resultOk = ok;
                  final String resultResponse = response;

                  runOnUiThread(() -> {
                    String script = "window.__financeNativeCallback(" +
                        JSONObject.quote(requestId) + "," +
                        resultOk + "," +
                        JSONObject.quote(resultResponse) + ")";
                    webView.evaluateJavascript(script, null);
                  });
                }).start();
              }
            }

            private String readAll(InputStream stream) throws Exception {
              if (stream == null) return "";
              StringBuilder sb = new StringBuilder();
              try (BufferedReader br = new BufferedReader(
                  new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                String line;
                while ((line = br.readLine()) != null) sb.append(line);
              }
              return sb.toString();
            }
          }
          EOF
          gradle wrapper --gradle-version 8.10.2
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
