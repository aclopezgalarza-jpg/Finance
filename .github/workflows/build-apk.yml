name: Build Finance APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK from web app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest sw.js supabase-config.js android/app/src/main/assets/www/
          if [ -n "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then sed -i "s|SUPABASE_ANON_KEY|${{ secrets.SUPABASE_PUBLISHABLE_KEY }}|g" android/app/src/main/assets/www/supabase-config.js; fi
          cp -r icons android/app/src/main/assets/www/
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Finance'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.finance.app'; compileSdk 35
            defaultConfig { applicationId 'com.finance.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '2.0.0' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/AppTheme" android:label="Finance" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p android/app/src/main/java/com/finance/app android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#111827</item><item name="android:navigationBarColor">#ffffff</item><item name="android:statusBarColor">#ffffff</item><item name="android:windowLightStatusBar">true</item></style></resources>
          EOF
          cat > android/app/src/main/java/com/finance/app/MainActivity.java <<'EOF'
          package com.finance.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.view.Window;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){super.onCreate(b); requestWindowFeature(Window.FEATURE_NO_TITLE); WebView w=new WebView(this); w.setWebViewClient(new WebViewClient()); w.getSettings().setJavaScriptEnabled(true); w.getSettings().setDomStorageEnabled(true); w.getSettings().setAllowFileAccess(true); w.loadUrl("file:///android_asset/www/index.html"); setContentView(w);}
          }
          EOF
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finance-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
